<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo — Asistente de WhatsApp</title>
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --page:#070b10;--panel:#0f1822;--line:#1d2a3a;--text:#e9f0f7;--muted:#94a6ba;
  --accent:#2dd4bf;--wa-green:#25d366;--head:#075e54;--chatbg:#0b141a;
  --in:#202c33;--out:#005c4b;--composer:#111b21;--input:#2a3942;
}
html,body{height:100%}
body{margin:0;background:radial-gradient(1200px 700px at 50% -10%,#0e1a20 0%,var(--page) 55%);color:var(--text);font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
.stage{min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:16px;padding:18px 18px 22px}
.toolbar{width:min(920px,100%);display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:rgba(15,24,34,.7);border:1px solid var(--line);border-radius:16px;padding:12px 16px;backdrop-filter:blur(10px)}
.toolbar .title{font-weight:700;letter-spacing:-.01em}
.toolbar .title span{color:var(--muted);font-weight:400;font-size:.88rem}
.tools{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.tool-btn{background:#142230;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px 14px;font-size:.86rem;font-weight:600;transition:border-color .15s ease,transform .15s ease}
.tool-btn:hover{border-color:var(--accent);transform:translateY(-1px)}
.tool-btn.primary{background:var(--accent);color:#04110e;border-color:transparent}
.hint{margin:0;color:var(--muted);font-size:.82rem;text-align:center}
.hint kbd{background:#142230;border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-size:.78em}

.phone{width:min(382px,94vw);height:min(730px,calc(100vh - 172px));background:#0a0f0d;border:1px solid #1f2c26;border-radius:42px;padding:9px;box-shadow:0 40px 100px rgba(0,0,0,.6);display:flex;flex-direction:column;overflow:hidden;position:relative}
.screen{background:var(--chatbg);border-radius:34px;overflow:hidden;display:flex;flex-direction:column;height:100%}
.statusbar{display:flex;justify-content:space-between;align-items:center;background:#0b141a;color:#d7e3ea;font-size:.7rem;padding:8px 18px 4px;letter-spacing:.02em}
.statusbar .sig{color:#9fb3bd}
.chat-head{display:flex;align-items:center;gap:10px;background:var(--head);padding:10px 14px 12px}
.avatar{width:38px;height:38px;border-radius:50%;background:#0f766e;display:grid;place-items:center;font-size:.74rem;font-weight:700;color:#d1fae5;flex:none}
.who{min-width:0}
.who strong{display:block;font-size:.92rem;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{display:block;color:#b9e8e1;font-size:.7rem;line-height:1.3}
.head-icons{margin-left:auto;color:#c8eee7;font-size:1.1rem;letter-spacing:.1em}
.chat{flex:1;overflow-y:auto;padding:14px 12px 10px;display:flex;flex-direction:column;gap:7px;background-image:radial-gradient(rgba(255,255,255,.035) 1px,transparent 1px);background-size:20px 20px;scrollbar-width:thin;scrollbar-color:#23343f transparent}
.msg{position:relative;max-width:84%;padding:8px 10px 18px;border-radius:10px;font-size:.845rem;line-height:1.38;white-space:pre-line;word-wrap:break-word;animation:pop .22s ease both}
.msg .time{position:absolute;right:9px;bottom:4px;font-size:.6rem;color:rgba(233,240,247,.55);letter-spacing:.01em}
.msg.in{align-self:flex-start;background:var(--in);border-top-left-radius:3px}
.msg.out{align-self:flex-end;background:var(--out);border-top-right-radius:3px}
.msg.sys{align-self:center;background:rgba(32,44,51,.6);color:#9db4bd;font-size:.7rem;padding:5px 12px;border-radius:999px;max-width:none}
.msg.sys .time{display:none}
@keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.msg.typing{padding:12px 14px;display:flex;gap:4px;align-items:center}
.msg.typing .tdot{width:6px;height:6px;border-radius:50%;background:#8fa7a1;animation:blink 1.2s infinite}
.msg.typing .tdot:nth-child(2){animation-delay:.2s}
.msg.typing .tdot:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:.35;transform:translateY(0)}30%{opacity:1;transform:translateY(-2px)}}
.quick{display:flex;gap:7px;overflow-x:auto;padding:8px 12px;background:#0e171e;border-top:1px solid rgba(255,255,255,.04);scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.quick button{flex:none;background:#14212a;border:1px solid #263843;color:#b7c9d2;border-radius:999px;padding:6px 11px;font-size:.75rem;transition:border-color .15s ease,color .15s ease}
.quick button:hover{border-color:var(--accent);color:#d9fbf4}
.composer{display:flex;gap:8px;align-items:center;padding:8px 10px 12px;background:#0e171e}
.composer input{flex:1;min-width:0;background:var(--input);border:1px solid transparent;border-radius:999px;padding:11px 15px;color:var(--text);font-size:.88rem;outline:none}
.composer input::placeholder{color:#7d8f98}
.composer input:focus{border-color:rgba(45,212,191,.5)}
.composer button{width:44px;height:44px;flex:none;border:none;border-radius:50%;background:#00a884;color:#04110e;font-size:1rem;display:grid;place-items:center}
.composer button:active{transform:scale(.96)}

/* Modo grabación: solo el teléfono, fondo limpio */
body.recording{background:#0b141a}
body.recording .toolbar,
body.recording .hint,
body.recording .quick{display:none}
body.recording .stage{justify-content:center;padding:10px}
body.recording .phone{height:min(820px,calc(100vh - 24px));box-shadow:none;border-color:#16211c}
.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:rgba(15,24,34,.95);border:1px solid var(--line);color:var(--text);padding:10px 16px;border-radius:999px;font-size:.82rem;opacity:0;pointer-events:none;transition:opacity .3s ease;z-index:99;white-space:nowrap}
.toast.show{opacity:1}
@media (max-width:520px){
  .toolbar{gap:10px;padding:10px 12px}
  .toolbar .title{font-size:.9rem}
  .toolbar .title span{display:none}
  .tools{margin-left:0;width:100%}
  .tool-btn{flex:1;padding:8px 10px;font-size:.8rem}
  .phone{height:min(720px,calc(100vh - 200px))}
}
@media (prefers-reduced-motion:reduce){
  .msg{animation:none}
  .msg.typing .tdot{animation:none;opacity:.6}
}
</style>
</head>
<body>
<div class="stage">
  <header class="toolbar">
    <div class="title">Demo interactivo <span>· asistente de WhatsApp</span></div>
    <div class="tools">
      <button class="tool-btn primary" id="autoBtn" type="button">▶ Reproducir demo</button>
      <button class="tool-btn" id="recordBtn" type="button">● Modo grabación</button>
      <button class="tool-btn" id="resetBtn" type="button">Reiniciar</button>
    </div>
  </header>

  <div class="phone">
    <div class="screen">
      <div class="statusbar"><span id="clock">9:41</span><span class="sig">▮▮▮ ⌁ ▰</span></div>
      <div class="chat-head">
        <div class="avatar">CS</div>
        <div class="who"><strong id="bizName">Clínica Sonrisa</strong><small id="presence">en línea</small></div>
        <div class="head-icons" aria-hidden="true">⋮</div>
      </div>
      <div class="chat" id="chat" aria-live="polite"></div>
      <div class="quick" id="quick">
        <button type="button" data-text="Quiero una cita">Quiero una cita</button>
        <button type="button" data-text="¿Cuánto cuesta la limpieza?">Precios</button>
        <button type="button" data-text="¿Cuál es su horario?">Horarios</button>
        <button type="button" data-text="¿Dónde están?">Ubicación</button>
      </div>
      <form class="composer" id="composer">
        <input id="input" type="text" placeholder="Escribe un mensaje…" autocomplete="off" aria-label="Mensaje">
        <button type="submit" aria-label="Enviar">➤</button>
      </form>
    </div>
  </div>

  <p class="hint">Escribe como si fueras el cliente, o pulsa <strong>Reproducir demo</strong>. En modo grabación: <kbd>Espacio</kbd> reproduce, <kbd>R</kbd> reinicia, <kbd>Esc</kbd> sale.</p>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   CONFIGURA AQUÍ TU NEGOCIO (nombre, servicios, precios, etc.)
   ============================================================ */
const CONFIG = {
  name: "Clínica Sonrisa",
  address: "Av. Morelos 123, Centro, Cuernavaca",
  hours: "Lunes a viernes de 9:00 a 19:00 · Sábado de 9:00 a 14:00",
  services: [
    { key: "limpieza",      name: "Limpieza dental",      price: 650  },
    { key: "blanqueamiento",name: "Blanqueamiento",       price: 1800 },
    { key: "ortodoncia",    name: "Consulta de ortodoncia",price: 350 },
    { key: "urgencia",      name: "Urgencia dental",      price: 400  }
  ]
};

/* ============================ Utilidades ============================ */
const $ = (sel, root = document) => root.querySelector(sel);
const chatEl = $("#chat");
const inputEl = $("#input");
const presenceEl = $("#presence");
const clockEl = $("#clock");
const toastEl = $("#toast");

const norm = (s) => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
const timeNow = () => new Date().toLocaleTimeString("es-MX", { hour: "2-digit", minute: "2-digit" });

let state = "idle";          // idle | awaiting_service | awaiting_slot | done
let selectedService = null;
let slots = [];
let autoToken = 0;           // cancela la reproducción automática
let typingEl = null;

/* ============================ Render del chat ============================ */
function scrollBottom() {
  chatEl.scrollTop = chatEl.scrollHeight;
}

function addMsg(kind, text) {
  const el = document.createElement("div");
  el.className = "msg " + kind;
  const body = document.createElement("span");
  body.textContent = text;
  el.appendChild(body);
  if (kind !== "sys") {
    const t = document.createElement("span");
    t.className = "time";
    t.textContent = timeNow();
    el.appendChild(t);
  }
  chatEl.appendChild(el);
  scrollBottom();
}

function showTyping() {
  if (typingEl) return;
  typingEl = document.createElement("div");
  typingEl.className = "msg out typing";
  typingEl.innerHTML = '<span class="tdot"></span><span class="tdot"></span><span class="tdot"></span>';
  chatEl.appendChild(typingEl);
  scrollBottom();
}

function hideTyping() {
  if (typingEl) {
    typingEl.remove();
    typingEl = null;
  }
}

function setPresence(text) {
  presenceEl.textContent = text;
}

function clearChat() {
  chatEl.innerHTML = "";
  typingEl = null;
}

async function botReply(text, delay = 1000) {
  const token = autoToken;
  setPresence("escribiendo…");
  showTyping();
  await wait(delay);
  if (token !== autoToken) { hideTyping(); return; }
  hideTyping();
  setPresence("en línea");
  addMsg("out", text);
}

/* ============================ Horarios ============================ */
function computeSlots() {
  const out = [];
  const times = ["10:00", "16:30", "12:30"];
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  let guard = 0;
  while (out.length < 3 && guard < 15) {
    d.setDate(d.getDate() + 1);
    guard++;
    if (d.getDay() === 0) continue; // cerrado domingo
    out.push({ date: new Date(d), time: times[out.length] });
  }
  return out;
}

function dayLabel(date) {
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const diff = Math.round((date - today) / 86400000);
  if (diff === 1) return "mañana";
  if (diff === 2) return "pasado mañana";
  return "el " + date.toLocaleDateString("es-MX", { weekday: "long", day: "numeric" });
}

function fullLabel(date) {
  return date.toLocaleDateString("es-MX", { weekday: "long", day: "numeric", month: "long" });
}

function slotsText() {
  const lines = slots.map((s, i) => `${i + 1}) ${dayLabel(s.date)} · ${s.time}`);
  return "Tengo estos horarios:\n" + lines.join("\n") + "\n¿Cuál te queda mejor?";
}

function parseSlotChoice(raw) {
  const t = norm(raw);
  const m = t.match(/\b(1|2|3)\b/);
  if (m) return Number(m[1]) - 1;
  if (t.includes("primera") || t.includes("uno")) return 0;
  if (t.includes("segunda") || t.includes("dos")) return 1;
  if (t.includes("tercera") || t.includes("tres")) return 2;
  for (let i = 0; i < slots.length; i++) {
    const label = norm(dayLabel(slots[i].date)).replace("el ", "");
    if (t.includes(label)) return i;
    if (t.includes(slots[i].time.slice(0, 2))) return i;
  }
  return -1;
}

function findService(raw) {
  const t = norm(raw);
  return CONFIG.services.find((s) => t.includes(norm(s.key)) || t.includes(norm(s.name)));
}

/* ============================ Cerebro del asistente ============================ */
async function respond(raw) {
  const t = norm(raw);
  const has = (...words) => words.some((w) => t.includes(norm(w)));

  if (has("cancelar", "cancela") && state === "done") {
    state = "idle";
    selectedService = null;
    await botReply("Cita cancelada. ¿Quieres agendar otra? Responde CITA o dime qué necesitas.", 900);
    return;
  }

  if (has("precio", "cuesta", "costo", "cuanto")) {
    const list = CONFIG.services.map((s) => `• ${s.name} — $${s.price}`).join("\n");
    await botReply(`Estos son nuestros precios:\n${list}\n¿Quieres agendar? Responde CITA.`, 1000);
    return;
  }

  if (has("horario", "abren", "cierran")) {
    await botReply(`${CONFIG.hours}.\n¿Te agendo una cita? Responde CITA.`, 950);
    return;
  }

  if (has("donde", "ubicacion", "direccion", "llegar")) {
    await botReply(`Estamos en ${CONFIG.address}.\n¿Quieres que te agende una cita?`, 950);
    return;
  }

  if (has("humano", "persona", "recepcion", "hablar con alguien")) {
    await botReply("Claro, te paso con una persona del equipo. Te escriben en unos minutos.", 900);
    return;
  }

  const svc = findService(raw);
  if (svc && state !== "awaiting_slot") {
    selectedService = svc;
    state = "awaiting_slot";
    await botReply(`¡Perfecto, ${svc.name.toLowerCase()}! ${slotsText()}`, 1200);
    return;
  }

  if (has("cita", "agendar", "agenda", "reservar", "turno") || state === "awaiting_service") {
    if (state === "awaiting_service") {
      const num = raw.match(/[1-4]/);
      if (num) {
        selectedService = CONFIG.services[Number(num[0]) - 1];
        state = "awaiting_slot";
        await botReply(`¡Perfecto! ${slotsText()}`, 1200);
        return;
      }
      await botReply("Elige un número del 1 al 4, o dime el servicio que necesitas.", 850);
      return;
    }
    if (state === "awaiting_slot") {
      await botReply(`Para agendar, responde 1, 2 o 3:\n${slotsText().replace("Tengo estos horarios:\n", "")}`, 950);
      return;
    }
    state = "awaiting_service";
    const menu = CONFIG.services.map((s, i) => `${i + 1}) ${s.name}`).join("\n");
    await botReply(`¡Con gusto! ¿Qué servicio necesitas?\n${menu}`, 1000);
    return;
  }

  if (state === "awaiting_slot") {
    const pick = parseSlotChoice(raw);
    if (pick !== -1) {
      const s = slots[pick];
      state = "done";
      await botReply(`Listo, quedó agendado:\n📅 ${fullLabel(s.date)} a las ${s.time}\n🦷 ${selectedService.name}\nTe mando recordatorio 24 h antes. ✅`, 1200);
      addMsg("sys", "Recordatorio programado: 24 h antes");
      return;
    }
    await botReply(`No alcancé a identificar el horario. Responde 1, 2 o 3:\n${slotsText().replace("Tengo estos horarios:\n", "")}`, 950);
    return;
  }

  if (has("hola", "buenas", "buenos dias", "buenas tardes", "buenas noches", "menu")) {
    await botReply(`¡Hola! Soy el asistente de ${CONFIG.name}.\nPuedo agendar citas, darte precios, horarios o ubicación. ¿Qué necesitas?`, 850);
    return;
  }

  await botReply("Puedo ayudarte con citas, precios, horarios y ubicación. Escribe CITA para empezar.", 900);
}

/* ============================ Envío manual ============================ */
function cancelAuto() {
  autoToken++;
  hideTyping();
  setPresence("en línea");
}

async function sendUser(text) {
  const clean = text.trim();
  if (!clean) return;
  cancelAuto();
  addMsg("in", clean);
  await respond(clean);
}

$("#composer").addEventListener("submit", (e) => {
  e.preventDefault();
  const text = inputEl.value;
  inputEl.value = "";
  sendUser(text);
});

document.querySelectorAll("#quick button").forEach((btn) => {
  btn.addEventListener("click", () => sendUser(btn.dataset.text));
});

/* ============================ Reproducción automática ============================ */
async function runAuto() {
  const token = ++autoToken;
  clearChat();
  state = "idle";
  selectedService = null;
  slots = computeSlots();
  setPresence("en línea");

  await wait(500);
  if (token !== autoToken) return;
  addMsg("in", "Hola, ¿tienen cita para limpieza esta semana?");

  await wait(700);
  if (token !== autoToken) return;
  setPresence("escribiendo…");
  showTyping();
  await wait(1500);
  if (token !== autoToken) return;
  hideTyping();
  setPresence("en línea");
  addMsg("out", `¡Claro! ${slotsText()}`);
  selectedService = CONFIG.services[0];

  await wait(900);
  if (token !== autoToken) return;
  addMsg("in", "La primera opción, por favor.");

  await wait(650);
  if (token !== autoToken) return;
  setPresence("escribiendo…");
  showTyping();
  await wait(1300);
  if (token !== autoToken) return;
  hideTyping();
  setPresence("en línea");
  const s = slots[0];
  addMsg("out", `Listo, quedó agendado:\n📅 ${fullLabel(s.date)} a las ${s.time}\n🦷 ${CONFIG.services[0].name}\nTe mando recordatorio 24 h antes. ✅`);

  await wait(700);
  if (token !== autoToken) return;
  addMsg("sys", "Recordatorio programado: 24 h antes");

  await wait(900);
  if (token !== autoToken) return;
  addMsg("in", "Perfecto, gracias.");

  await wait(650);
  if (token !== autoToken) return;
  setPresence("escribiendo…");
  showTyping();
  await wait(900);
  if (token !== autoToken) return;
  hideTyping();
  setPresence("en línea");
  addMsg("out", "¡Con gusto! Si necesitas cambiarla, responde CANCELAR.");
  state = "done";
}

/* ============================ Reinicio ============================ */
async function resetChat() {
  cancelAuto();
  const token = autoToken;
  clearChat();
  state = "idle";
  selectedService = null;
  slots = computeSlots();
  await wait(350);
  if (token !== autoToken) return;
  setPresence("escribiendo…");
  showTyping();
  await wait(650);
  if (token !== autoToken) { hideTyping(); return; }
  hideTyping();
  setPresence("en línea");
  addMsg("out", `¡Hola! Soy el asistente de ${CONFIG.name}.\nPuedo agendar citas, darte precios, horarios o ubicación. ¿En qué te ayudo?`);
}

/* ============================ Botones y teclado ============================ */
$("#autoBtn").addEventListener("click", runAuto);
$("#resetBtn").addEventListener("click", resetChat);

function showToast(text) {
  toastEl.textContent = text;
  toastEl.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toastEl.classList.remove("show"), 3500);
}

$("#recordBtn").addEventListener("click", () => {
  const on = document.body.classList.toggle("recording");
  if (on) {
    if (document.activeElement) document.activeElement.blur();
    showToast("Modo grabación · Espacio: demo · R: reiniciar · Esc: salir");
  }
});

document.addEventListener("keydown", (e) => {
  if (e.target === inputEl) {
    if (e.key === "Escape") inputEl.blur();
    return;
  }
  if (e.code === "Space") {
    e.preventDefault();
    runAuto();
  } else if (e.key.toLowerCase() === "r") {
    resetChat();
  } else if (e.key === "Escape") {
    document.body.classList.remove("recording");
  }
});

/* ============================ Arranque ============================ */
$("#bizName").textContent = CONFIG.name;
clockEl.textContent = timeNow();
setInterval(() => { clockEl.textContent = timeNow(); }, 30000);

const params = new URLSearchParams(location.search);
if (params.has("rec")) document.body.classList.add("recording");

if (params.has("auto")) {
  setTimeout(runAuto, 600);
} else {
  resetChat();
}
</script>
</body>
</html>
